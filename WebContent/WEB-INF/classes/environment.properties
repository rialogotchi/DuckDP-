# ADDED FOR LOCAL NETWORK USE
# Originally this file came from a separate private "secrets" project (see README.md).
# These are safe local-network defaults - edit as you like.

# Since isProduction() compares this to "www.duckdns.org", leaving it as
# anything else keeps the app in "local/dev" mode (http, no google analytics etc).
public-hostname=localhost

# Sessions are only cached locally in memory/JSON - dynamo session cache stays off.
dynamo-session-cache=false

# Set to true to lock the account and DPI settings: no token re-creation, no account deletion, no settings changes from the web UI (start/stop still work).
account-read-only=false

# No longer used (storage is a local JSON file store now) - left blank.
local-db=

server_number=1
