# ADDED FOR LOCAL NETWORK USE
# Originally this file came from a separate private "secrets" project (see README.md).
# The OAuth (google/twitter/reddit/facebook/persona) buttons are hidden in the UI now
# (see WEB-INF/tags/header.tag), so those keys can stay blank.

# Only used to verify password hashes imported from the old local JSON store
# (new passwords use PBKDF2 with a random per-user salt). Keep the old value
# if you import old accounts, otherwise it does not matter.
salt=please-change-this-local-salt-to-something-random

# Internal name-server addresses used to push cache-flush events - not needed
# for local username/password login/signup to work, safe to leave as-is.
FIXED_IP_NS1=127.0.0.1
FIXED_IP_NS2=127.0.0.1
FIXED_IP_NS3=127.0.0.1
FIXED_IP_NS1_INTERNAL=127.0.0.1
FIXED_IP_NS2_INTERNAL=127.0.0.1
FIXED_IP_NS3_INTERNAL=127.0.0.1

redditAppID=
redditAppSecret=

googleApiKey=
googleApiSecret=

twitterApiKey=
twitterApiSecret=

GOOGLE_TRACKING_ID=
