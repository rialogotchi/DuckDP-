# Duck DPI launcher settings (shell syntax). Restart ./duckdns after editing.

# Web UI / token API
HTTP_HOST=0.0.0.0
HTTP_PORT=8080

# true  = start the bundled PocketBase next to the web app (data in <home>/data/pb_data)
# false = use the PocketBase given in pocketbase.properties
POCKETBASE_MANAGED=true
POCKETBASE_PORT=8090

# JVM options (heap etc.)
JAVA_OPTS="-Xms32m -Xmx256m"

# The DPI proxy (ByeDPI's ciadpi) that the web app starts. Empty = the copy inside the bundle.
# Set a path to use another build. The proxy's own settings (port, strategy, autostart) live in the
# web page / ./duckdns dpi ..., not here.
DPI_BIN=
