# DuckDNS - environment.properties (portable build)
# Edit this file, then restart ./duckdns

# Since isProduction() compares this to "www.duckdns.org", leaving it as
# anything else keeps the app in "local/dev" mode (http, no google analytics etc).
public-hostname=localhost

# true = keep web sessions in PocketBase (collection duck_sessions).
# false = plain in-memory Jetty sessions (default, fine for a single instance).
# (The key keeps its historical name.)
dynamo-session-cache=false

# true = block token re-creation, account deletion and changes to the DPI settings from the web UI
# (start / stop still work).
account-read-only=false

# No longer used (data lives in PocketBase now) - left blank.
local-db=

server_number=1
