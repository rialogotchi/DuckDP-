# DuckDNS - PocketBase connection.
#
# With the bundled PocketBase (POCKETBASE_MANAGED=true in duckdns.conf) the
# launcher generates the superuser password below on first start and points
# the app at the bundled instance - you do not need to touch anything.
#
# To use an EXTERNAL PocketBase (v0.23 or newer) set POCKETBASE_MANAGED=false
# in duckdns.conf and fill in url + a superuser email/password here.
pocketbase.url=http://127.0.0.1:8090
pocketbase.email=duckdns@example.com
pocketbase.password=
