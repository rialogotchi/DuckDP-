# Jetty 9.4 base configuration for the DuckDNS war.
# Same module set as conf/jetty_config/start.ini from the original project
# (server, deploy, jsp + jstl, http) minus websocket, which the app never used.

--module=server
--module=deploy
--module=http
--module=jsp
--module=jstl

jsp-impl=apache

jetty.http.port=8080
jetty.http.idleTimeout=30000
jetty.threadPool.minThreads=4
jetty.threadPool.maxThreads=100
jetty.httpConfig.sendServerVersion=false
jetty.httpConfig.sendDateHeader=true
jetty.httpConfig.requestHeaderSize=8192
jetty.httpConfig.responseHeaderSize=8192

# the war never changes while running - no need to poll the webapps dir
jetty.deploy.scanInterval=0
