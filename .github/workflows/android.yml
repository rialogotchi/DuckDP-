name: android-apk
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch native sources (ByeDPI + tun2socks)
        working-directory: android/app/src/main/jni
        run: |
          git clone --depth 1 https://github.com/hufrea/byedpi byedpi
          git clone --depth 1 --recursive https://github.com/heiher/hev-socks5-tunnel hev-socks5-tunnel
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: duckdpi-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
